server:
  port: 8082

spring:
  application:
    name: level-2-separate-tables
  datasource:
    url: jdbc:h2:file:./data/bank2;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update   # keep tables and data after the app stops
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8082/h2-console  (JDBC URL: jdbc:h2:file:./data/bank2)
