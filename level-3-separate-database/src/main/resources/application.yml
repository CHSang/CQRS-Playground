server:
  port: 8083

spring:
  application:
    name: level-3-separate-database
  # Write database: used by the command side through JPA
  datasource:
    url: jdbc:h2:mem:bank3_write;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8083/h2-console  (JDBC URL: jdbc:h2:mem:bank3_write or jdbc:h2:mem:bank3_read)
  rabbitmq:           # start it with: podman compose up -d
    host: localhost
    port: 5672
    username: guest
    password: guest
  # Liquibase runs the read database migrations (pointed at the read DB, not the write DB)
  liquibase:
    change-log: classpath:db/changelog/read-db-changelog.yaml
    url: ${app.read-datasource.url}
    user: ${app.read-datasource.username}
    password: ${app.read-datasource.password}

# Read database: used by the query side through JdbcClient (see ReadDbConfig)
app:
  read-datasource:
    url: jdbc:h2:mem:bank3_read;DB_CLOSE_DELAY=-1
    username: sa
    password:
