server:
  port: 8081

spring:
  application:
    name: level-1-split-code
  datasource:
    url: jdbc:h2:file:./data/bank1;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update   # keep tables and data after the app stops
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8081/h2-console  (JDBC URL: jdbc:h2:file:./data/bank1)
